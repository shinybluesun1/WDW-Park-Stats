<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Park Stats</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Park Stats">
<meta name="theme-color" content="#0d0b1a">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Monoton&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b1a;--panel:#17142b;--panel2:#201c3a;--line:#2e2950;--text:#f3efff;--muted:#a59fc4;--accent:#ff4fa3;--accent2:#3de3ff;--gold:#ffd23f;--good:#5dff9d;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;height:var(--app-h,auto);display:flex;flex-direction:column;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left);background:var(--bg)}
#scroller{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-top:env(safe-area-inset-top);padding-bottom:24px;background:radial-gradient(1200px 500px at 50% -200px,#3a1d5c55,transparent),var(--bg)}
header{padding:16px 16px 4px;text-align:center}
h1{font-family:Monoton,cursive;font-weight:400;font-size:clamp(24px,8vw,34px);margin:0;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}

main{max-width:640px;margin:0 auto;padding:4px 14px}
.ridebtn{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.ridebtn.holding{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;transition:box-shadow .55s}
#lineBanner{max-width:640px;margin:6px auto 0;padding:0 14px}
.lb{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#3a2a10,#2b1640);border:1px solid var(--gold);border-radius:16px;padding:10px 10px 10px 14px}
.lb .lbt{font-weight:700;font-size:15px;line-height:1.2}
.lb .btn{flex:none}
.li.tap{cursor:pointer}.chev{color:var(--muted);font-size:22px;padding:0 4px}
.secl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin:18px 0 8px}
.songgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sg{display:flex;gap:8px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font:inherit;font-size:13px;line-height:1.2;color:var(--text);text-align:left;cursor:pointer}
.sg.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;text-align:center;padding:8px 4px;border-radius:9px;font:inherit;font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer}
.seg button.on{background:var(--accent);color:#1a0010;font-weight:500}
.waitrow{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pct{font-size:12px;padding:2px 7px;border-radius:99px;background:var(--panel2);white-space:nowrap}

section{display:none}section.on{display:block}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:22px 4px 10px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
h3{font-size:16px;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:10px}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
input[type=date],input[type=time]{color-scheme:dark}
label{font-size:13px;color:var(--muted);display:block;margin:12px 0 6px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.btn{font:inherit;font-weight:500;border-radius:12px;padding:11px 16px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1a0010}
.btn.danger{color:#ff7a8a;border-color:#5a2533}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.x{background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;padding:2px 8px;line-height:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:13px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.subtabs{display:flex;gap:4px;margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs .chip{flex:1 0 auto;border:0;background:none;border-radius:10px;padding:9px 10px;font-weight:500}
.subtabs .chip.on{background:var(--accent);color:#1a0010}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.list .li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.t{font-size:12px;color:var(--muted)}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--panel2);color:var(--muted);margin-left:6px;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:20px 10px;font-size:14px}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.datebar{display:flex;align-items:center;gap:8px}
.datebar .btn{flex:none;padding:10px 14px}
.datebar .lbl{flex:1;text-align:center;font-weight:700;font-size:17px;position:relative}
.datebar input{position:absolute;inset:0;opacity:0;cursor:pointer}
.rides{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ridebtn{position:relative;text-align:left;padding:13px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:14px;font-weight:500;line-height:1.25;cursor:pointer;min-height:64px;transition:transform .08s}
.ridebtn:active{transform:scale(.97);background:var(--panel2)}
.ridebtn .k{display:block;font-size:11px;color:var(--muted);margin-top:4px;font-weight:400}
.ridebtn .n{position:absolute;top:8px;right:8px;background:var(--accent);color:#1a0010;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px}
.stat b{display:block;font-size:21px;line-height:1.2;word-break:break-word}
.stat.sm b{font-size:17px}
.stat span{font-size:11px;color:var(--muted)}
.bar{margin:10px 0}
.bar .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;gap:8px}
.bar .top span:last-child{color:var(--muted);white-space:nowrap}
.track{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px}
.trend{display:flex;flex-direction:column;gap:7px}
.trow{display:grid;grid-template-columns:92px 1fr 30px;gap:8px;align-items:center;font-size:12px}
.trow .lbl{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--panel2)}
.trow .n{text-align:right;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.big{font-size:34px;font-weight:700;line-height:1.1}
.prog{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.prog div{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.feat{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.feat:last-of-type{border-bottom:0}
.feat .grow div:first-child{font-size:15px}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);border-radius:99px;transition:.2s}
.sw span::before{content:"";position:absolute;width:22px;height:22px;left:2px;top:2px;background:var(--muted);border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--accent);border-color:var(--accent)}
.sw input:checked+span::before{transform:translateX(20px);background:#fff}
.jentry{white-space:pre-wrap;line-height:1.5;margin-top:6px}
.stars{color:var(--gold);letter-spacing:1px}
.bar.tap{cursor:pointer}.bar.tap .top span:first-child::after{content:" ›";color:var(--muted)}
.cmp{font-size:12px;margin-top:8px;color:var(--muted);line-height:1.6}
.up{color:var(--good)}.down{color:#ff7a8a}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rec{background:var(--panel2);border-radius:12px;padding:10px 11px}
.rec b{display:block;font-size:17px}.rec span{font-size:11px;color:var(--muted)}
.cols{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:6px}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.cols .c i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--accent2);min-height:2px}
.cols .c em{font-style:normal;font-size:9px;color:var(--muted);margin-top:4px;white-space:nowrap}
.cols .c u{text-decoration:none;font-size:9px;color:var(--text);margin-bottom:2px}
details.more summary{list-style:none;cursor:pointer;color:var(--accent2);font-size:14px;padding:4px 0}
details.more summary::-webkit-details-marker{display:none}
nav{flex:none;position:relative;display:flex;background:#100d22;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--muted);font:inherit;font-size:10.5px;padding:9px 0 11px;cursor:pointer}
nav button .ic{display:block;font-size:20px;margin-bottom:2px}
nav button.on{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:11px 14px 11px 16px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;transition:.2s;z-index:30;max-width:92vw}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer}
#sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.show{display:flex}
.sheet-card{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h b{font-size:18px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:14px;margin-top:8px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;cursor:pointer}
.opt .a{color:var(--muted);font-size:12px}
.btnrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btnrow .btn{flex:1}
@media (min-width:700px){
  main,#lineBanner{max-width:980px}
  .rides{grid-template-columns:repeat(3,1fr)}
  #statBody{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;align-items:start}
  #statBody>.sec{min-width:0}
  #statBody>.sec.full,#statBody>.empty{grid-column:1/-1}
  #jList{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #jList .card+.card{margin-top:0}
  #hotelBody .list,#setBody .list{column-gap:24px}
  nav{justify-content:center}
  nav button{max-width:150px}
  #sheet{align-items:center}
  .sheet-card{max-width:560px;border-radius:20px;border-bottom:1px solid var(--line);max-height:86vh}
}
@media (min-width:1000px){.rides{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="scroller">
<header>
  <h1>Park Stats</h1>
</header>
<div id="lineBanner" style="display:none"></div>

<main>
  <section id="v-today" class="on">
    <div class="datebar" style="margin-top:10px">
      <button class="btn" data-act="day" data-n="-1">‹</button>
      <div class="lbl"><span id="dayLbl"></span><input type="date" id="dayPick" aria-label="Pick date"></div>
      <button class="btn" data-act="day" data-n="1">›</button>
    </div>
    <div class="stats" id="todayTiles" style="margin-top:12px;grid-template-columns:1fr 1fr">
      <div class="stat"><b id="tRides">0</b><span id="tRidesL">rides</span></div>
      <div class="stat" id="tStepsTile"><b><input id="tSteps" type="number" inputmode="numeric" placeholder="0" style="padding:0;border:0;background:none;font-size:21px;font-weight:700"></b><span>steps (tap to enter)</span></div>
      <div class="stat" id="tHoursTile"><b id="tHours">–</b><span>hours in parks</span></div>
      <div class="stat" id="tCostTile"><b id="tPass">–</b><span id="tPassL">cost / day</span></div>
    </div>
    <h2>Which park?</h2>
    <div class="chips" id="parkChips"></div>
    <div id="visitsWrap" style="margin-top:10px"><div class="card"><div class="btnrow" id="visitBtns" style="margin-top:0"></div><div class="list" id="visitList"></div></div></div>
    <h2 id="rideHead">What did you ride?</h2>
    <div class="rides" id="rideBtns"></div>
    <div id="showWrap"><h2 id="showHead">🎭 Shows</h2><div class="rides" id="showBtns"></div></div>
    <h2>Logged this day</h2>
    <div class="card"><div class="list" id="dayList"></div>
      <div class="toggle" style="margin-top:10px;border-top:1px solid var(--line);padding-top:12px"><input type="checkbox" id="parkDay"><label for="parkDay" style="margin:0;color:var(--text)" id="parkDayLbl">Count as a park day</label></div>
    </div>
    <button class="btn wide" id="momentBtn" style="margin-top:12px" data-act="tab" data-v="journal" data-new="1">✨ Add a magical moment</button>
  </section>

  <section id="v-stats">
    <h2>Time period <button class="btn sm" data-act="shareStats">📤 Share stats</button></h2>
    <div class="chips" id="periodChips"></div>
    <div class="row" id="customRange" style="display:none;margin-top:8px">
      <div><label>From</label><input type="date" id="from"></div>
      <div><label>To</label><input type="date" id="to"></div>
    </div>
    <div class="subtabs" id="statTabs"></div>
    <div class="stats" style="margin-top:12px" id="statTiles"></div>
    <div id="statBody"></div>
  </section>

  <section id="v-pass"><div id="passBody"></div></section>
  <section id="v-hotels"><div id="hotelBody"></div></section>

  <section id="v-journal">
    <h2>New magical moment</h2>
    <div class="card">
      <div class="row"><div><label style="margin-top:0">Date</label><input type="date" id="jDate"></div><div><label style="margin-top:0">Park (optional)</label><select id="jPark"></select></div></div>
      <label>What happened?</label>
      <textarea id="jText" placeholder="The fireworks lined up perfectly with the moon…"></textarea>
      <button class="btn pri wide" style="margin-top:12px" data-act="jAdd">Save moment</button>
    </div>
    <h2>Your moments <span id="jCount"></span></h2>
    <input id="jSearch" placeholder="Search moments" style="margin-bottom:10px">
    <div id="jList"></div>
  </section>

  <section id="v-set"><div id="setBody"></div></section>
</main>
</div>

<nav>
  <button data-act="tab" data-v="today" class="on"><span class="ic">🎢</span>Today</button>
  <button data-act="tab" data-v="stats"><span class="ic">📊</span>Stats</button>
  <button data-act="tab" data-v="pass" id="navCost"><span class="ic">🎟️</span><span id="navCostL">Pass</span></button>
  <button data-act="tab" data-v="hotels" id="navHotels"><span class="ic">🏨</span>Hotels</button>
  <button data-act="tab" data-v="journal" id="navJournal"><span class="ic">✨</span>Journal</button>
  <button data-act="tab" data-v="set"><span class="ic">⚙️</span>Settings</button>
</nav>

<div id="toast"><span id="toastMsg"></span><button id="toastBtn"></button></div>
<div id="sheet"><div class="sheet-card"><div class="sheet-h"><b id="sheetTitle"></b><button class="x" data-act="closeSheet" aria-label="Close">×</button></div><div id="sheetBody"></div></div></div>
<input type="file" id="fileIn" accept=".json,application/json,text/plain" hidden>

<script>
(() => {
"use strict";
const KEY = "parkStats.v2", OLD_KEY = "cosmicSongTracker.v1";
const APP_VERSION = "2026-11-20.9";
const COLORS = ["#ff4fa3","#3de3ff","#ffd23f","#5dff9d","#b78cff","#ff8a3d","#4f8bff","#ff5f5f","#c6ff3d","#3dffd0","#ff9be0","#9aa7ff"];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const pd = s => new Date(s + "T00:00");
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((pd(b) - pd(a)) / 86400000);
const money = n => "$" + (Math.round(n * 100) / 100).toLocaleString(undefined, { minimumFractionDigits: n < 100 ? 2 : 0, maximumFractionDigits: n < 100 ? 2 : 0 });
const num = n => Math.round(n).toLocaleString();
const dLabel = (s, o) => pd(s).toLocaleDateString([], o || { weekday: "short", month: "short", day: "numeric", year: pd(s).getFullYear() !== new Date().getFullYear() ? "numeric" : undefined });
const tLabel = t => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

/* ---------- defaults ---------- */
function song(id, name, artist, i){ return { id, name, artist, retired: false, color: COLORS[i % COLORS.length] }; }
const CATALOG = 3;
const NO_LL = new Set(["carrousel", "astro", "granfiesta", "wdwrr", "wildlifetrain"]);
const hasLL = r => !r.show && r.ll !== false;
function defaultRides(){
  const R = (id, name, park, kind, songs) => ({ id, name, park, kind: kind || "plain", retired: false, songs: songs || [] });
  const SH = (id, name, park) => ({ id, name, park, kind: "plain", show: true, retired: false, songs: [] });
  return [
    // Magic Kingdom rides
    R("tron","TRON Lightcycle / Run","mk"), R("space","Space Mountain","mk"), R("buzz","Buzz Lightyear's Space Ranger Spin","mk","score"),
    R("peoplemover","PeopleMover","mk"), R("astro","Astro Orbiter","mk"), R("speedway","Tomorrowland Speedway","mk"),
    R("btm","Big Thunder Mountain","mk"), R("tiana","Tiana's Bayou Adventure","mk"), R("hm","Haunted Mansion","mk"),
    R("potc","Pirates of the Caribbean","mk"), R("jungle","Jungle Cruise","mk"), R("carpets","Magic Carpets of Aladdin","mk"),
    R("7dmt","Seven Dwarfs Mine Train","mk"), R("peter","Peter Pan's Flight","mk"), R("smallworld","it's a small world","mk"),
    R("pooh","Winnie the Pooh","mk"), R("mermaid","Under the Sea (Little Mermaid)","mk"), R("dumbo","Dumbo","mk"),
    R("teacups","Mad Tea Party","mk"), R("barnstormer","The Barnstormer","mk"), R("carrousel","Prince Charming Regal Carrousel","mk"),
    R("wdwrr","Walt Disney World Railroad","mk"),
    // Magic Kingdom shows
    SH("hea","Happily Ever After","mk"), SH("starlight","Disney Starlight Parade","mk"), SH("fof","Festival of Fantasy Parade","mk"),
    SH("tiki","Enchanted Tiki Room","mk"), SH("countrybears","Country Bear Musical Jamboree","mk"), SH("philharmagic","Mickey's PhilharMagic","mk"),
    SH("laughfloor","Monsters, Inc. Laugh Floor","mk"),
    // EPCOT rides
    R("gotg","Guardians: Cosmic Rewind","ep","song",[

function periodRange(){

  if (period === "month") return [ymd(new Date(d.getFullYear(), d.getMonth(), 1)), t];
  if (period === "year") return [d.getFullYear() + "-01-01", t];

  if (period === "custom") return [$("from").value || "0000-01-01", $("to").value || "9999-12-31"];
  return ["0000-01-01", "9999-12-31"];

function prevRange(a, b){

  const hourDays = Object.keys(S.days).filter(d => d >= a && d <= b && hoursOf(d) > 0);

  const avgClock = arr => { if (!arr.length) return "–"; const m = Math.round(arr.reduce((s, v) => s + v, 0) / arr.length); return fmtClock(pad(Math.floor(m / 60)) + ":" + pad(m % 60)); };
  const sorted = [...pdays].sort(); let streak = 0, run = 0, prevD = null, streakEnd = null;
  sorted.forEach(d => { run = prevD && addDays(prevD, 1) === d ? run + 1 : 1; if (run > streak) { streak = run; streakEnd = d; } prevD = d; });
  const distinct = new Set(L.map(e => e.r));

    ${notYet.length ? `<details class="more"><summary>Show the ${activeRides.length - doneCount} you haven't ridden ›</summary>${notYet.map(x => `<div style="margin-top:10px"><b style="color:${x.p.color};font-size:14px">${esc(x.p.name)}</b><div class="t" style="margin-top:3px;line-height:1.6">${x.list.map(r => esc(r.name)).join(" · ")}</div></div>`).join("")}</details>` : `<p class="note" style="margin:6px 0 0">🏆 You've ridden every active ride in this period!</p>`}</div>`;

      ${pdays.size ? `<p class="note" style="margin:10px 0 0">Favorite day: <b>${names[wd.indexOf(Math.max(...wd))]}</b>${Math.max(...wd) > 0 ? " · most rides on " + names[wdr.indexOf(Math.max(...wdr))] + "s" : ""}</p>` : ""}</div>`;

    if (!sc.length) return;

    REPORT.scores.push({ name: r.name, best, avg, count: vals.length });

  const keys = [...buckets.keys()].sort().reverse();

  const gc = document.createElement("div"); chips(gc, [["day","Day"],["week","Week"],["month","Month"],["year","Year"]], group, "group");
  h += `<h2>Rides over time</h2><div class="chips">${gc.innerHTML}</div><div class="card" style="margin-top:8px">

    const tp = S.parks.filter(p => ph[p.id] > 0).sort((x, y) => ph[y.id] - ph[x.id]);

        <h2>By ride</h2><div class="card"><div class="list">${rows.map(rw => `<div class="li"><span class="dot" style="background:${park(ride(rw.id).park).color}"></span><div class="grow">
          <div class="waitrow"><span>${esc(ride(rw.id).name)}</span>${rw.pct != null ? pctTag(rw.pct) : ""}</div>

  h = shownSecs.map(k => `<div class="sec${shownSecs.length === 1 || k === "compare" || k === "overtime" ? " full" : ""}">${SEC[k]}</div>`).join("");
  if (!h.trim()) h = `<div class="card empty" style="margin-top:14px">Nothing to show here for this period.</div>`;
  $("statBody").innerHTML = h;
}

function passForm(p){

    { k: "start", label: "Starts", type: "date", value: p.start, req: true },

/* Old song tracker → Cosmic Rewind rides */
function mergeOldSongTracker(o){
  let gotg = S.rides.find(r => r.id === "gotg") || S.rides.find(r => /cosmic rewind/i.test(r.name));
  if (!gotg) { gotg = { id: "gotg", name: "Guardians: Cosmic Rewind", park: (S.parks.find(p => p.id === "ep") || S.parks[0] || {}).id, kind: "song", retired: false, songs: [] }; S.rides.push(gotg); }
  gotg.kind = "song";
  const map = {};
  (o.songs || []).forEach(s => {
    if (!s || !s.id || !s.name) return;
    let m = gotg.songs.find(x => x.id === s.id && x.name.toLowerCase() === String(s.name).toLowerCase()) || gotg.songs.find(x => x.name.toLowerCase() === String(s.name).toLowerCase());
    if (!m) { m = { id: uid(), name: String(s.name), artist: String(s.artist || ""), retired: !!s.retired, color: s.color || COLORS[gotg.songs.length % COLORS.length] }; gotg.songs.push(m); }
    map[s.id] = m.id;
  });
  const have = new Set(S.log.map(e => e.id)); let n = 0;
  (o.rides || []).forEach(r => {
    if (!r || !isFinite(r.t) || !map[r.s]) return;
    const id = "old-" + (r.id || r.t); if (have.has(id)) return;

}

function jpegPdf(jpg, w, h){
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const push = v => { const b = typeof v === "string" ? enc.encode(v) : v; parts.push(b); len += b.length; };

  const obj = (n, body) => { offs[n] = len; push(n + " 0 obj\n"); body(); push("\nendobj\n"); };
  push("%PDF-1.4\n");
  obj(1, () => push("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2, () => push("<< /Type /Pages /Kids [3 0 R] /Count 1 >>"));
  obj(3, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`));
  obj(4, () => { push(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`); push(jpg); push("\nendstream"); });
  const content = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
  obj(5, () => push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
  const xref = len; let xr = "xref\n0 6\n0000000000 65535 f \n";
  for (let i = 1; i <= 5; i++) xr += String(offs[i]).padStart(10, "0") + " 00000 n \n";
  push(xr + `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);

}

  try { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000); toast("Saved " + name); return true; }

/* ---------- screen fit ----------
   iPhone home-screen apps sometimes report a viewport shorter than the screen
   (by roughly the top + bottom safe areas). Measure ourselves and, when running
   full-screen, use the real screen height. Re-check whenever things change. */
function fitScreen(){
  let h = window.innerHeight;
  const standalone = navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  if (standalone && /iPhone|iPod/.test(navigator.userAgent)) {
    const portrait = window.innerHeight >= window.innerWidth;
    const fullH = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    const fullW = portrait ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
    if (Math.abs(window.innerWidth - fullW) <= 2 && h < fullH) h = fullH;
  }
  document.body.style.setProperty("--app-h", h + "px");
}
const refit = () => { fitScreen(); setTimeout(fitScreen, 120); setTimeout(fitScreen, 500); };
["resize", "orientationchange", "pageshow", "focus"].forEach(ev => window.addEventListener(ev, refit));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refit(); });
document.addEventListener("focusout", () => setTimeout(fitScreen, 300));
if (window.visualViewport) visualViewport.addEventListener("resize", refit);

  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === tab));
  const cm = S.costMode;
  $("navCost").style.display = cm === "off" ? "none" : "";
  $("navCostL").textContent = cm === "tickets" ? "Tickets" : "Pass";
  $("navCost").querySelector(".ic").textContent = cm === "tickets" ? "🎫" : "🎟️";
  if (tab === "pass" && cm === "off") tab = "today";
  $("navHotels").style.display = F("hotels") ? "" : "none";
  $("navJournal").style.display = F("journal") ? "" : "none";
  if ((tab === "hotels" && !F("hotels")) || (tab === "journal" && !F("journal"))) tab = "today";
  document.querySelectorAll("main section").forEach(s => s.classList.toggle("on", s.id === "v-" + tab));
  renderLine();
  if (tab === "today") renderToday();
  else if (tab === "stats") renderStats();
  else if (tab === "pass") (S.costMode === "tickets" ? renderTickets : renderPass)();
  else if (tab === "hotels") renderHotels();
  else if (tab === "journal") renderJournal();
  else if (tab === "set") renderSettings();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case "tab": tab = el.dataset.v; if (el.dataset.new) { $("jDate").value = curDay; setTimeout(() => $("jText").focus(), 50); } $("scroller").scrollTop = 0; render(); break;
    case "closeSheet": closeSheet(); break;
    case "day": curDay = addDays(curDay, +el.dataset.n); render(); break;
    case "park": curPark = el.dataset.k; try { localStorage.setItem(KEY + ".park", curPark); } catch (err) {} render(); break;
    case "ride": if (held) { held = false; break; } tapRide(id); break;
    case "lineBoard": lineBoard(); break;
    case "lineMenu": lineMenu(); break;
    case "waitEdit": e.preventDefault(); waitEdit(id); break;
    case "logEdit": logEdit(id); break;
    case "delLog": { const ent = S.log.find(x => x.id === id); if (!ent) break; S.log = S.log.filter(x => x !== ent); save(); toast("Ride deleted", "Undo", () => { S.log.push(ent); save(); }); break; }
    case "period": period = el.dataset.k; render(); break;
    case "sstab": sstab = el.dataset.k; $("scroller").scrollTop = 0; render(); break;
    case "stab": stab = el.dataset.k; $("scroller").scrollTop = 0; render(); break;
    case "group": group = el.dataset.k; render(); break;
    case "toggleAll": showAllRides = !showAllRides; render(); break;
    case "rideInfo": rideInfo(id); break;
    case "shareStats": shareStats(); break;
    case "checkUpdate": checkForUpdate(true); break;
    case "passAdd": passForm(); break;
    case "ticketAdd": ticketForm(); break;
    case "visitAdd": visitForm(); break;
    case "visitEdit": visitForm(+el.dataset.i); break;
    case "visitArrive": { const vs = visitsOf(curDay).map(v => Object.assign({}, v)); vs.forEach(v => { if (!v.out && toMin(nowHM()) > toMin(v.in)) v.out = nowHM(); }); vs.push({ park: curPark, in: nowHM(), out: "" }); setVisits(curDay, vs); toast((vs.length > 1 && vs[vs.length - 2].out === nowHM() ? "🚝 Hopped to " : "📍 Arrived at ") + park(curPark).name); break; }
    case "visitLeave": { const vs = visitsOf(curDay).map(v => Object.assign({}, v)); const o = vs.find(v => !v.out); if (!o) break; o.out = nowHM(); if (toMin(o.out) <= toMin(o.in)) o.out = ""; setVisits(curDay, vs); toast(o.out ? "Left " + park(o.park).name + " · " + fmtH(visitMins(o) / 60) : "Too soon to leave — edit the times instead"); break; }
    case "ticketEdit": ticketForm(S.tickets.find(t => t.id === id)); break;
    case "passEdit": passForm(S.passes.find(p => p.id === id)); break;
    case "stayAdd": stayForm(); break;
    case "stayEdit": stayForm(S.stays.find(s => s.id === id)); break;
    case "jAdd": {
      const text = $("jText").value.trim(); if (!text) { $("jText").focus(); break; }
      S.journal.push({ id: uid(), d: $("jDate").value || today(), park: $("jPark").value, text, c: Date.now() });
      $("jText").value = ""; save(); toast("✨ Moment saved"); break;
    }
    case "jEdit": { const j = S.journal.find(x => x.id === id); if (!j) break;
      openForm("Edit moment", [{ k: "d", label: "Date", type: "date", value: j.d, req: true }, { k: "park", label: "Park", type: "select", value: j.park, options: parkOptions("—") }, { k: "text", label: "What happened?", type: "textarea", value: j.text, req: true }],
        v => { Object.assign(j, v); save(); }, { focus: false, onDelete: () => { S.journal = S.journal.filter(x => x !== j); save(); }, deleteMsg: "Delete this moment?" }); break; }
    case "parkAdd": parkForm(); break;
    case "parkEdit": parkForm(S.parks.find(p => p.id === id)); break;
    case "rideAdd": rideForm(); break;
    case "rideEdit": rideForm(S.rides.find(r => r.id === id)); break;
    case "songs": songsSheet(id); break;
    case "export": doExport(); break;
    case "copy": doCopy(); break;
    case "import": $("fileIn").click(); break;
    case "pasteImport": importText($("pasteIn").value); break;
    case "wipe": confirmBox("Erase every ride, day, pass, ticket, stay and journal entry? Export a backup first if you might want them back.", "Erase everything", () => { S = defaults(); save(); toast("All data erased"); }, "Keep my data", "Erase all data?"); break;
  }
});
$("fileIn").onchange = async e => { const f = e.target.files[0]; e.target.value = ""; if (f) importText(await f.text()); };
$("dayPick").onchange = () => { if ($("dayPick").value) { curDay = $("dayPick").value; render(); } };
$("tSteps").onchange = () => {
  const n = Math.max(0, Math.round(+$("tSteps").value || 0));
  S.days[curDay] = Object.assign({}, S.days[curDay], { steps: n });
  if (dayEmpty(S.days[curDay])) delete S.days[curDay];
  save(); if (n) toast(num(n) + " steps saved");
};
$("parkDay").onchange = () => {
  const d = S.days[curDay] = Object.assign({}, S.days[curDay], { visit: $("parkDay").checked });
  if (dayEmpty(d)) delete S.days[curDay];
  save();
};
$("from").onchange = $("to").onchange = render;
document.addEventListener("change", e => {
  const sk = e.target.dataset && e.target.dataset.stat;
  if (sk) { S.statsOff = Object.assign({}, S.statsOff, { [sk]: !e.target.checked }); save(); const st = STAT_SECTIONS.find(x => x[0] === sk); toast(st[1].replace(/^\S+\s/, "") + (e.target.checked ? " on" : " off")); return; }
  const fk = e.target.dataset && e.target.dataset.feat;
  if (fk) { S.features = Object.assign({}, S.features, { [fk]: e.target.checked }); save(); const f = FEATURES.find(x => x[0] === fk); toast(f[1].replace(/^\S+\s/, "") + (e.target.checked ? " on" : " off")); }
});
document.addEventListener("change", e => { if (e.target.id === "costMode") { S.costMode = e.target.value; save(); toast(S.costMode === "off" ? "Cost tab hidden" : (S.costMode === "tickets" ? "Tracking tickets" : "Tracking annual pass")); } });
$("jSearch").oninput = render;
window.addEventListener("focus", () => { if (tab === "today" && document.activeElement !== $("tSteps")) render(); });

/* ---------- first run: pull in old song tracker data on this site ---------- */
if (firstRun) {
  try {
    const old = JSON.parse(localStorage.getItem(OLD_KEY));
    if (old && Array.isArray(old.rides) && old.rides.length) { const n = mergeOldSongTracker(old); setTimeout(() => toast(`Brought over ${n} Cosmic Rewind rides from your song tracker`), 600); }
  } catch (e) {}
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}
if (S._catalogAdded) { delete S._catalogAdded; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} setTimeout(() => toast("🎭 New rides & shows added to your list"), 800); }
try { const ov = visitsOf(today()).find(v => !v.out); if (ov && S.parks.some(p => p.id === ov.park)) curPark = ov.park; } catch (e) {}
render();
})();
</script>
</body>
</html>
